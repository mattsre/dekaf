apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dekaf.fullname" . }}
  labels:
    {{- include "dekaf.labels" . | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dekaf.selectorLabels" . | nindent 6 }}
  {{- with .Values.deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.config }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dekaf.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dekaf.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "dekaf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DEKAF_PULSAR_WEB_URL
              value: {{ .Values.pulsar.webUrl | quote }}
            - name: DEKAF_PULSAR_BROKER_URL
              value: {{ .Values.pulsar.brokerUrl | quote }}
            - name: DEKAF_PORT
              value: {{ .Values.containerPort | quote }}
            {{- if .Values.pulsar.oauth }}
            - name: DEKAF_DEFAULT_PULSAR_AUTH
              value: {{ .Values.pulsar.oauth | toJson | quote }}
            {{- end }}
            {{- if .Values.pulsar.name }}
            - name: DEKAF_PULSAR_NAME
              value: {{ .Values.pulsar.name | quote }}
            {{- end }}
            {{- if .Values.pulsar.color }}
            - name: DEKAF_PULSAR_COLOR
              value: {{ .Values.pulsar.color | quote }}
            {{- end }}
            {{- if .Values.pulsar.listenerName }}
            - name: DEKAF_PULSAR_LISTENER_NAME
              value: {{ .Values.pulsar.listenerName | quote }}
            {{- end }}
            {{- with .Values.deployment.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.enabled .Values.config .Values.deployment.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: library
              mountPath: /dekaf/data/library
            {{- end }}
            {{- if .Values.config }}
            - name: config
              mountPath: /dekaf/config.yaml
              subPath: config.yaml
            {{- end }}
            {{- with .Values.deployment.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with .Values.deployment.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.config .Values.deployment.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: library
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-library" (include "dekaf.fullname" .)) }}
        {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "dekaf.fullname" . }}-config
        {{- end }}
        {{- with .Values.deployment.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
